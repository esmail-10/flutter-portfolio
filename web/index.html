<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Ismail — Flutter Developer Portfolio">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ismail Portfolio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/images/profile/favicon.png"/>

  <title>Ismail — Flutter Developer</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #0B0F19;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    .web-loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 3.5px solid rgba(34, 211, 238, 0.15);
      border-top: 3.5px solid #22D3EE;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .loading-text {
      margin-top: 20px;
      color: #94A3B8;
      font-size: 14px;
      letter-spacing: 0.5px;
      font-weight: 500;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="web-preloader" class="web-loading-container">
    <div class="spinner"></div>
    <div class="loading-text">Loading ismail.dev...</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
